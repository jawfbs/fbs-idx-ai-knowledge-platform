<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">FBS AI Knowledge Platform architecture</title><desc id="desc">Sources flow through secure synchronization and indexing into the Next.js knowledge experience.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111d35"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#33e6ae"/><stop offset="1" stop-color="#6e8cff"/></linearGradient></defs><rect width="1400" height="720" rx="28" fill="url(#bg)"/><text x="70" y="80" fill="#fff" font-family="Inter,Arial" font-size="34" font-weight="800">Knowledge architecture</text><text x="70" y="116" fill="#9fb0cb" font-family="Inter,Arial" font-size="18">Approved sources → secure indexing → trusted internal answers</text><g font-family="Inter,Arial"><g transform="translate(70 190)"><rect width="260" height="330" rx="24" fill="#0e1b31" stroke="#33435e"/><text x="28" y="48" fill="#8fa2bf" font-size="14" font-weight="700" letter-spacing="2">APPROVED SOURCES</text><g fill="#182942"><rect x="28" y="78" width="204" height="52" rx="12"/><rect x="28" y="146" width="204" height="52" rx="12"/><rect x="28" y="214" width="204" height="52" rx="12"/><rect x="28" y="282" width="204" height="52" rx="12"/></g><g fill="#e4ecf8" font-size="17" font-weight="700"><text x="52" y="111">Google Drive</text><text x="52" y="179">Confluence</text><text x="52" y="247">Flexmls MCP</text><text x="52" y="315">GitHub Skills</text></g></g><g transform="translate(430 190)"><rect width="260" height="330" rx="24" fill="#0e1b31" stroke="#33435e"/><text x="28" y="48" fill="#8fa2bf" font-size="14" font-weight="700" letter-spacing="2">SECURE PIPELINE</text><circle cx="130" cy="120" r="48" fill="#153049" stroke="#33e6ae"/><text x="130" y="126" text-anchor="middle" fill="#fff" font-size="18" font-weight="800">SYNC</text><path